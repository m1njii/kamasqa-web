<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" fill="none" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Degradados lineales arquitectónicos -->
    <linearGradient id="grad-contour-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="var(--c-lime, #9FE81A)" stop-opacity="0.35" />
      <stop offset="50%" stop-color="var(--c-olive, #6E7D4E)" stop-opacity="0.20" />
      <stop offset="100%" stop-color="var(--c-sand, #F0C48C)" stop-opacity="0.05" />
    </linearGradient>

    <linearGradient id="grad-contour-2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="var(--c-amber, #AA7229)" stop-opacity="0.25" />
      <stop offset="60%" stop-color="var(--c-olive, #6E7D4E)" stop-opacity="0.15" />
      <stop offset="100%" stop-color="var(--c-lime, #9FE81A)" stop-opacity="0.03" />
    </linearGradient>

    <!-- Patrón de malla de coordenadas -->
    <pattern id="coord-grid" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M 100 0 L 0 0 0 100" fill="none" stroke="currentColor" stroke-opacity="0.04" stroke-width="1" />
      <circle cx="0" cy="0" r="1.5" fill="currentColor" fill-opacity="0.18" />
    </pattern>
  </defs>

  <!-- Malla de fondo sutil -->
  <rect width="100%" height="100%" fill="url(#coord-grid)" />

  <!-- Líneas de Contorno Topográfico Editorial (Suaves y Orgánicas) -->
  <g class="contour-layer" stroke-linecap="round">
    <!-- Curva 1 -->
    <path d="M-100,240 C280,180 520,380 920,260 C1280,150 1480,310 1720,220" 
          stroke="url(#grad-contour-1)" stroke-width="1.8" fill="none" />

    <!-- Curva 2 -->
    <path d="M-100,320 C320,260 560,460 960,340 C1320,230 1520,390 1720,300" 
          stroke="currentColor" stroke-opacity="0.07" stroke-width="1.4" fill="none" />

    <!-- Curva 3 -->
    <path d="M-100,400 C360,340 600,540 1000,420 C1360,310 1560,470 1720,380" 
          stroke="url(#grad-contour-2)" stroke-width="1.6" fill="none" stroke-dasharray="6 4" />

    <!-- Curva 4 -->
    <path d="M-100,480 C400,420 640,620 1040,500 C1400,390 1600,550 1720,460" 
          stroke="currentColor" stroke-opacity="0.08" stroke-width="1.2" fill="none" />

    <!-- Curva 5 (Elevación Inferior) -->
    <path d="M-100,620 C240,560 580,780 1080,640 C1440,520 1580,700 1720,600" 
          stroke="url(#grad-contour-1)" stroke-width="1.8" fill="none" />

    <!-- Curva 6 -->
    <path d="M-100,700 C280,640 620,860 1120,720 C1480,600 1620,780 1720,680" 
          stroke="currentColor" stroke-opacity="0.06" stroke-width="1.2" fill="none" />

    <!-- Curva 7 (Fondo Profundo) -->
    <path d="M-100,820 C360,760 700,940 1200,830 C1540,730 1660,880 1720,800" 
          stroke="url(#grad-contour-2)" stroke-width="1.4" fill="none" stroke-dasharray="8 6" />
  </g>

  <!-- Arcos Geométricos de Precisión y Ángulos Arquitectónicos -->
  <g class="geometry-layer" stroke="currentColor" stroke-opacity="0.08" fill="none">
    <!-- Centro focal izquierdo -->
    <circle cx="280" cy="380" r="180" stroke-width="1" stroke-dasharray="4 8" />
    <circle cx="280" cy="380" r="280" stroke-width="1" />
    <circle cx="280" cy="380" r="420" stroke-width="1.2" stroke-dasharray="12 12" />
    <line x1="280" y1="80" x2="280" y2="680" stroke-width="1" stroke-opacity="0.06" />
    <line x1="-20" y1="380" x2="580" y2="380" stroke-width="1" stroke-opacity="0.06" />

    <!-- Centro focal derecho superior -->
    <circle cx="1320" cy="280" r="140" stroke-width="1" stroke-dasharray="3 6" />
    <circle cx="1320" cy="280" r="240" stroke-width="1" />
    <circle cx="1320" cy="280" r="360" stroke-width="1.2" stroke-dasharray="8 8" />
    <line x1="1320" y1="20" x2="1320" y2="540" stroke-width="1" stroke-opacity="0.06" />
    <line x1="1060" y1="280" x2="1580" y2="280" stroke-width="1" stroke-opacity="0.06" />

    <!-- Centro focal inferior -->
    <circle cx="940" cy="740" r="200" stroke-width="1" stroke-dasharray="6 6" />
    <circle cx="940" cy="740" r="320" stroke-width="1" />
  </g>

  <!-- Marcadores Técnicos de Coordenadas y Cruces (+) -->
  <g class="markers-layer" fill="currentColor" fill-opacity="0.22" font-family="monospace" font-size="11" font-weight="700">
    <!-- Cruces -->
    <path d="M 276 380 H 284 M 280 376 V 384" stroke="var(--c-lime, #9FE81A)" stroke-width="2" />
    <path d="M 1316 280 H 1324 M 1320 276 V 284" stroke="var(--c-lime, #9FE81A)" stroke-width="2" />
    <path d="M 936 740 H 944 M 940 736 V 744" stroke="var(--c-lime, #9FE81A)" stroke-width="2" />

    <path d="M 646 220 H 654 M 650 216 V 224" stroke="currentColor" stroke-opacity="0.25" stroke-width="1.5" />
    <path d="M 1116 510 H 1124 M 1120 506 V 514" stroke="currentColor" stroke-opacity="0.25" stroke-width="1.5" />
    <path d="M 186 690 H 194 M 190 686 V 694" stroke="currentColor" stroke-opacity="0.25" stroke-width="1.5" />
    <path d="M 1486 780 H 1494 M 1490 776 V 784" stroke="currentColor" stroke-opacity="0.25" stroke-width="1.5" />

    <!-- Coordenadas Geográficas Sutiles de Lima / Global -->
    <text x="295" y="384" fill-opacity="0.45" letter-spacing="1">12°02'36"S 77°01'42"W · KAMASQA HQ</text>
    <text x="1335" y="284" fill-opacity="0.35" letter-spacing="1">EDGE NETWORK · NODE LATAM-01</text>
    <text x="955" y="744" fill-opacity="0.35" letter-spacing="1">SYS ARCHITECTURE · 99.9% UPTIME</text>
  </g>
</svg>
